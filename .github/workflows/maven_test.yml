name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Dependency Resolution
        run: mvn test-compile --batch-mode --quiet

      - name: Run tests with Maven
        run: mvn test --batch-mode -Dorg.slf4j.simpleLogger.defaultLogLevel=warn